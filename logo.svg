<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 48" role="img" aria-labelledby="title">
  <title id="title">tmleonel.com</title>
  <!-- Gradient definitions -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3d5afe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d4ff3d;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Modern geometric logo -->
  <g>
    <!-- Hexagon-inspired shape -->
    <circle cx="24" cy="24" r="20" fill="none" stroke="#3d5afe" stroke-width="2" opacity="0.3"/>
    <circle cx="24" cy="24" r="12" fill="none" stroke="url(#grad1)" stroke-width="2.5" stroke-dasharray="37.7" stroke-dashoffset="0" style="animation: dash 2s ease-in-out infinite;"/>
    
    <!-- Center accent -->
    <circle cx="24" cy="24" r="4" fill="#d4ff3d"/>
    
    <!-- Triangular accent -->
    <polygon points="24,14 30,30 18,30" fill="none" stroke="#3d5afe" stroke-width="1.5" opacity="0.6"/>
  </g>
  
  <!-- Text -->
  <text x="58" y="31" fill="#101218" font-family="'Space Grotesk', Arial, sans-serif" font-size="20" font-weight="700">tmleonel</text>
  <text x="153" y="31" fill="#626875" font-family="'Space Grotesk', Arial, sans-serif" font-size="20">.com</text>
  
  <style>
    @keyframes dash {
      0% { stroke-dashoffset: 0; }
      50% { stroke-dashoffset: -37.7; }
      100% { stroke-dashoffset: 0; }
    }
  </style>
</svg>