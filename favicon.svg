<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="tmleonel.com favicon">
  <defs>
    <linearGradient id="favGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3d5afe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d4ff3d;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="64" height="64" fill="#ffffff"/>
  
  <!-- Main icon -->
  <circle cx="32" cy="32" r="24" fill="none" stroke="#3d5afe" stroke-width="2" opacity="0.2"/>
  <circle cx="32" cy="32" r="16" fill="none" stroke="url(#favGrad)" stroke-width="2.5"/>
  
  <!-- Center dot -->
  <circle cx="32" cy="32" r="5" fill="#d4ff3d"/>
  
  <!-- Accent triangle -->
  <polygon points="32,18 42,48 22,48" fill="none" stroke="#3d5afe" stroke-width="1.5" opacity="0.7"/>
</svg>